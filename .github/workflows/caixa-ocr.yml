name: Caixa OCR Gratuito
on:
  workflow_dispatch:
    inputs:
      lancamento_id:
        description: "ID do lançamento do Caixa"
        required: true
        type: string
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Preparar comprovante privado
        env:
          LANCAMENTO_ID: ${{ inputs.lancamento_id }}
          SUPABASE_URL: https://eujcktievzdhfjpfpuql.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RbcBblBNvOvqGOMfhvvcnQ_JCSo0MtB
        run: |
          python - <<'PY'
          import os, json, urllib.request
          url=os.environ["SUPABASE_URL"]+"/functions/v1/caixa-ocr-dispatch"
          body=json.dumps({"lancamento_id":os.environ["LANCAMENTO_ID"]}).encode()
          req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["SUPABASE_PUBLISHABLE_KEY"]},method="POST")
          with urllib.request.urlopen(req) as r: data=json.load(r)
          if not data.get("ok") or not data.get("signed_url"): raise SystemExit("Falha ao preparar comprovante")
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write("OCR_IMAGE_URL="+data["signed_url"]+"\n")
          PY
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
          python -m pip install --disable-pip-version-check pillow pytesseract opencv-python-headless
      - name: Processar comprovante
        env:
          OCR_OUTPUT: ocr-result.json
        run: python tools/caixa-ocr/worker.py
      - name: Publicar somente resultado estruturado
        uses: actions/upload-artifact@v4
        with:
          name: caixa-ocr-result
          path: ocr-result.json
          retention-days: 1
